<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module Syntheses — Claude Associate PM Prep</title>
<link rel="stylesheet" href="shared/styles.css">
<script src="data/syntheses.js"></script>
<style>
  .module-jump {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .jump-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .jump-btn:hover { border-color: var(--accent); color: var(--accent); }

  .synth-block { margin-bottom: 12px; }
  .synth-theme {
    font-size: 14.5px;
    font-style: italic;
    color: var(--text);
    line-height: 1.6;
    margin: 14px 0 16px;
    padding-left: 14px;
    border-left: 3px solid var(--border);
  }
  .synth-section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .insight-list { list-style: none; padding: 0; margin-bottom: 16px; }
  .insight-list li {
    font-size: 13px;
    padding: 7px 0 7px 18px;
    border-bottom: 1px solid var(--border);
    position: relative;
    line-height: 1.55;
    color: var(--text);
  }
  .insight-list li:last-child { border-bottom: none; }
  .insight-list li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-weight: 700; }

  .trap-list { list-style: none; padding: 0; margin-bottom: 16px; }
  .trap-list li {
    font-size: 13px;
    padding: 7px 0 7px 18px;
    border-bottom: 1px solid var(--border);
    position: relative;
    line-height: 1.55;
    color: var(--text);
  }
  .trap-list li:last-child { border-bottom: none; }
  .trap-list li::before { content: '⚠'; position: absolute; left: 0; color: var(--red); font-size: 11px; top: 9px; }

  .key-quote {
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 14px;
    font-style: italic;
    color: var(--text-bright);
    font-weight: 600;
    margin-bottom: 14px;
    border-left: 3px solid var(--accent);
  }
  .key-quote::before { content: '"'; color: var(--accent); font-style: normal; font-size: 20px; line-height: 0; vertical-align: -4px; margin-right: 4px; }

</style>
</head>
<body>

<nav class="nav">
  <span class="nav-brand"><span>Claude</span> Associate — PM Prep</span>
  <div class="nav-links">
    <a href="index.html">Hub</a>
    <a href="overview.html">Overview</a>
    <a href="cheatsheet.html">Cheat Sheet</a>
    <a href="syntheses.html" class="active">Syntheses</a>
    <a href="glossary.html">Glossary</a>
    <a href="exam.html">Exam Trainer</a>
  </div>
</nav>

<div class="page-header">
  <div class="page-header-text">
    <div class="eyebrow">Module Syntheses</div>
    <h1>What to Know, Module by Module</h1>
    <p>Key insights, exam traps, and the defining quote for each of the 8 modules.</p>
  </div>
  <div class="page-header-actions">
    <button class="btn-primary" onclick="window.print()">↓ Export PDF</button>
  </div>
</div>

<div class="main">

  <div class="module-jump" id="jump-nav"></div>
  <div id="synth-list"></div>

</div>

<script src="shared/utils.js"></script>
<script>
function renderSyntheses() {
  const jumpNav = document.getElementById('jump-nav');
  const list = document.getElementById('synth-list');

  SYNTHESES.forEach(s => {
    // Jump nav button
    const btn = document.createElement('button');
    btn.className = 'jump-btn';
    btn.textContent = s.module;
    btn.onclick = () => document.getElementById(`synth-${s.module}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
    jumpNav.appendChild(btn);

    // Accordion
    const m = s.module;
    const colorClass = MODULE_COLORS[m] || 'm1';
    const div = document.createElement('div');
    div.className = 'accordion-item open synth-block';
    div.id = `synth-${m}`;
    div.innerHTML = `
      <div class="accordion-header" onclick="this.closest('.accordion-item').classList.toggle('open')">
        <div style="display:flex; align-items:center; gap:12px; flex:1;">
          <div style="font-family:-apple-system,sans-serif;font-size:36px;font-weight:900;letter-spacing:-0.04em;line-height:1;color:var(--${colorClass});flex-shrink:0;width:44px;">${m}</div>
          <div>
            <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px;">Module ${m}</div>
            <div class="acc-title">${s.title}</div>
          </div>
        </div>
        <span class="accordion-arrow">▾</span>
      </div>
      <div class="accordion-body">
        <div class="synth-theme">${s.theme}</div>

        <div class="synth-section-label">Key insights</div>
        <ul class="insight-list">
          ${s.insights.map(i => `<li>${i}</li>`).join('')}
        </ul>

        <div class="synth-section-label">Exam traps</div>
        <ul class="trap-list">
          ${s.exam_traps.map(t => `<li>${t}</li>`).join('')}
        </ul>

        <div class="key-quote">${s.key_quote}</div>
      </div>`;
    list.appendChild(div);
  });
}

renderSyntheses();
</script>
</body>
</html>
